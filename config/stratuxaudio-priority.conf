# systemd drop-in for shairport-sync, installed as
#   /etc/systemd/system/shairport-sync.service.d/stratuxaudio.conf
# Traffic first: the ADS-B decoders always win the CPU; music gets what's left.

[Unit]
After=avahi-daemon.service sound.target
Wants=avahi-daemon.service

[Service]
Nice=10
CPUWeight=20
CPUQuota=50%
IOWeight=10
MemoryMax=128M
Restart=on-failure
RestartSec=5
